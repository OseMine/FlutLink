[package]
name = "flutlink"
version = "1.3.2"
description = "FlutLink — FlutCloud desktop client (two-way sync, sharing, admin)"
authors = ["OseMine"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flutlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-cli = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
base64 = "0.23"
keyring = "4.1.6"
reqwest = { version = "0.13", features = ["json", "gzip", "stream", "form"] }
quick-xml = "0.41"
urlencoding = "2"
tokio = { version = "1.53.1", features = ["sync", "fs", "time", "rt", "macros", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
httpdate = "1"
dotenvy = "0.15"
sha2 = "0.11"
getrandom = "0.2"
# Disk mount: a local WebDAV server (hyper) served over the platform's
# WebDAV redirector (WebClient / mount_webdav / gio) — driverless on all OSes.
dav-server = "0.11"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
