name: opencode-review

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional: Fokusbereich des Reviews (z. B. 'WebDAV/OCS-Backend')"
        required: false
        type: string
  schedule:
    - cron: "0 6 * * 1" # Montag 06:00 UTC

# Guard gegen parallele Läufe (Review-PRs kollidierten auf todo.md).
concurrency:
  group: opencode-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install opencode (pinned)
        shell: bash
        run: npm install --global opencode-ai@1.18.18

      - name: Run OpenCode review
        shell: bash
        id: review
        continue-on-error: true
        env:
          # OpenCode Zen API-Key als Secret anlegen:
          # GitHub → Settings → Secrets and variables → Actions → OPENCODE_API_KEY
          # (Key unter https://opencode.ai/auth abrufen; Free-Modelle kosten nichts)
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PROMPT: |
            Automatisiertes Code-Review des FlutLink-Projekts (Tauri v2 Desktop-App:
            Nextcloud-Sync-Client mit Rust-Backend und Vue 3 + TypeScript + Tailwind-Frontend).
            Fokusbereich: ${{ github.event.inputs.focus || 'das gesamte Projekt' }}

            Gehe vor wie im Reviewer-Agent beschrieben:
            1. Lies README.md, package.json, vite.config.ts, den Code unter src/
               (Vue-Komponenten, Pinia-Stores, lib/ipc.ts), das Backend unter
               src-tauri/ (lib.rs, commands.rs, accounts.rs, state.rs, error.rs,
               nextcloud/webdav.rs, nextcloud/ocs.rs) sowie die Workflows/Actions
               unter .github/. Falls eine todo.md existiert, lies sie ebenfalls.
            2. Finde Bugs, fehlende Features und Verbesserungsvorschläge für die
               IPC-Commands, die WebDAV/OCS-Anbindung, die Schlüsselbund-Verwaltung
               (keyring), das Fehler-/State-Management und die CI. Verifiziere
               Verdachtsfälle, indem du Tests ausführst (cargo test --manifest-path
               src-tauri/Cargo.toml bzw. npm run build).
            3. Schreibe den Review SOFRÜH WIE MÖGLICH als datierten Abschnitt
               („## Review YYYY-MM-DD …") in todo.md und fülle ihn während des
               Reviews schrittweise. Schreibe das Review nicht erst ganz am Ende.
            4. Hänge neue Befunde als datierten Abschnitt oben in todo.md an (falls
               vorhanden), bestehende Einträge unangetastet lassen.
            5. Prüfe, welche Punkte aus todo.md erledigt wurden, markiere sie als
               erledigt („[x]") und verschiebe abgehakte Todos in die datei archived-todos.md".

            WICHTIG:
            - Nur todo.md verändern — KEINEN Anwendungscode,
              KEINE Workflows/Actions. Keine Git-Operationen (committen, pushen,
              PRs, Merges, Branch-Löschungen) — das übernimmt die Workflow-Step.
            - Keine GitHub-API-/gh-Aufrufe. Keine destructive Aktionen.
            - Beende deine Antwort direkt nach Schritt 5.

            Regeln: Keine Findings ohne konkrete Datei-/Funktionsnamen. Wenn keine
            neuen Befunde vorhanden sind, vermerke das ausdrücklich im Review-Bericht.
        run: |
          # Zeitlimit (25 min) schützt vor hängenden Läufen; der PR-Step läuft
          # trotzdem und committet auch Teilergebnisse.
          timeout 1500 opencode run \
            --model opencode/deepseek-v4-flash-free \
            --agent reviewer \
            --auto \
            --title "Weekly review $(date -u +%Y-%m-%d)" \
            "$PROMPT" || echo "opencode beendet mit Fehler/Timeout"

      - name: Create pull request with review results
        if: always()
        uses: peter-evans/create-pull-request@v8
        with:
          branch: review/opencode-${{ github.run_id }}
          commit-message: "chore: opencode review report"
          title: "chore: opencode review report"
          body: |
            Automatisierter Review-Bericht von opencode.

            - Enthält nur Änderungen an `todo.md`.
            - Bitte prüfen und mergen.
          delete-branch: true
