name: opencode-todo-issues

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional: nur diesen Abschnitt/Titel in todo.md verarbeiten (Teilstring)"
        required: false
        type: string
  schedule:
    - cron: "0 6 * * 3" # Mittwoch 06:00 UTC

# Guard gegen parallele Läufe, die duplizierte Issues erzeugen würden.
concurrency:
  group: opencode-todo-issues
  cancel-in-progress: true

# Minimalberechtigungen: nur Issues dürfen erstellt werden, kein Code-Schreibzugriff.
permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install opencode (pinned)
        shell: bash
        run: npm install --global opencode-ai@1.18.18

      - name: Run opencode to create issues from todo.md
        shell: bash
        env:
          # OpenCode Zen API-Key als Secret anlegen:
          # GitHub → Settings → Secrets and variables → Actions → OPENCODE_API_KEY
          # (Key unter https://opencode.ai/auth abrufen; Free-Modelle kosten nichts)
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Eingeschränktes Token (nur issues: write) für gh/API-Aufrufe.
          GH_TOKEN: ${{ github.token }}
          PROMPT: |
            Aufgabe: Erzeuge GitHub-Issues aus den offenen Aufgaben in todo.md.

            Schritte:
            1. Prüfe zuerst, ob todo.md im Repo existiert. Falls nicht, beende
               sofort mit einer kurzen Meldung ("Keine todo.md vorhanden") und
               erstelle KEINE Issues. Lies dann todo.md vollständig.
            2. Sammle alle offenen Aufgaben – erkennbar an „- [ ]"-Checkboxen –
               sowie die als „Tracking offene GitHub-Issues" notierten Punkte.
               Fokusbereich (optional): ${{ github.event.inputs.focus || 'alle offenen Punkte' }}
            3. Gruppiere zusammengehörige Punkte sinnvoll zu einem Issue
               (ein Issue pro logischem Task, nicht ein Issue pro Zeile).
            4. Erzeuge für jede Gruppe genau EIN GitHub-Issue mit:
               - aussagekräftigem Titel (deutsch, kurz),
               - Body mit: Kontext, betroffene Dateien/Funktionen (mit Zeilennummern
                 aus todo.md), Akzeptanzkriterien und den daraus übernommenen
                 todo.md-Text.
            5. Vergib bei der Erstellung passende Labels (Parameter `labels` der
               GitHub-REST-API bzw. `gh issue create --label`):
               - Bug/Datenverlust/Sicherheitsproblem → `bug` (Sicherheits-Befunde
                 zusätzlich `security`)
               - Neues Feature → `enhancement`
               - Performance → `perf`
               - UX/Design → `ux`
               - Doku → `documentation`
               - CI/Workflows/Build/Release → `ci`
               - Mobile-Client-Befunde → `android`
               - Sync-Engine-Befunde → `sync`
               Fehlt ein Label, lege es zuerst an (`gh label create <name> --color …`
               bzw. POST /repos/{owner}/{repo}/labels). Schlägt das Label-Anlegen
               fehl (z. B. 403 wegen minimaler Token-Rechte), erstelle das Issue
               trotzdem mit dem am besten passenden existierenden Label und vermerke
               das in der Zusammenfassung. Lege KEINE Labels an, die in der Liste
               oben nicht genannt sind.
            6. Nutze die GitHub API via $GH_TOKEN (REST: POST /repos/{owner}/{repo}/issues)
               oder das installierte `gh`-CLI (GH_TOKEN ist gesetzt).
            7. Duplizierte/bereits existierende Issues nicht neu anlegen – vorher
               bestehende Issues per API auflisten und Titel vergleichen.

            WICHTIG:
            - Verändere KEINE Dateien, committe NICHTS und erstelle KEINEN Pull Request.
            - Jedes erstellte Issue MUSS mindestens ein passendes Label erhalten (siehe
              Schritt 5); Issues ohne Label sind ein Fehler.
            - Antworte am Ende mit einer Zusammenfassung der erstellten Issues
              (Nummer, Titel, Label) und der übersprungenen Duplikate.
        run: |
          # Zeitlimit (25 min) schützt vor hängenden Läufen; nur der
          # issues:write-Token wird an opencode weitergereicht.
          timeout 1500 opencode run \
            --model opencode/deepseek-v4-flash-free \
            --auto \
            "$PROMPT" || echo "opencode beendet mit Fehler/Timeout"
