name: FlutCloud App

on:
  push:
    branches: [main]
    paths:
      - "flutcloud-app/**"
      - "scripts/install-nextcloud.sh"
      - ".github/workflows/flutcloud.yml"
  pull_request:
    paths:
      - "flutcloud-app/**"
      - "scripts/install-nextcloud.sh"
      - ".github/workflows/flutcloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP lint + capability contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP
        shell: bash
        run: |
          command -v php >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq php-cli
          }
          php --version

      - name: Lint all PHP files (php -l)
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            out="$(php -l "$f" 2>&1)" || { echo "::error file=$f::$out"; failed=1; }
          done < <(find flutcloud-app -type f -name '*.php' -print0)
          [ "$failed" = 0 ] && echo "All PHP files linted clean"

      - name: Validate composer manifest
        shell: bash
        working-directory: flutcloud-app
        run: composer validate --no-check-publish

      - name: Capability contract (client expects capabilities.flutcloud)
        shell: bash
        run: php flutcloud-app/tests/capability-contract.php

  scripts:
    name: Install script smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: ShellCheck + syntax check (bash)
        shell: bash
        run: |
          command -v shellcheck >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          }
          # L17-N2: lint every shell script in the repo (the README one-liner
          # entry points included), not only the FlutCloud installer.
          failed=0
          while IFS= read -r -d '' f; do
            echo "Checking $f"
            bash -n "$f" || failed=1
            shellcheck -S warning "$f" || failed=1
          done < <(find . -type f -name '*.sh' -not -path './node_modules/*' -print0)
          [ "$failed" = 0 ] && echo "All shell scripts linted clean"
          exit "$failed"

      - name: PowerShell parse check (.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # L20-N3: parse every PowerShell script in scripts/ (the README
          # one-liner entry point included), not only the FlutCloud installer.
          foreach ($file in Get-ChildItem scripts -Filter '*.ps1') {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$($file.Name)::$($errors[0].Message)"
              exit 1
            }
            Write-Host "OK $($file.Name)"
          }

      - name: info.xml is well-formed XML
        shell: bash
        run: |
          command -v php >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq php-cli
          }
          php -r 'exit((simplexml_load_file("flutcloud-app/appinfo/info.xml") === false) ? 1 : 0);'
