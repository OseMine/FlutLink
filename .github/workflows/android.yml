name: android

# CI for the FlutLink Android client (`android/`). The Android app is a port
# of the FlutLink desktop client (Tauri/Vue) to Kotlin + Jetpack Compose,
# generated with opencode — it must stay buildable in CI on every change.
#
# The ubuntu-24.04 runners ship an Android SDK (ANDROID_HOME is preset), so
# the gradle wrapper builds directly; no sdkmanager step is needed.

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '*.md'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (assembleDebug)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flutlink-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint (lintDebug)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Run Android lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug --console=plain

  complete:
    name: Android CI complete
    needs: [build, lint]
    runs-on: ubuntu-24.04
    steps:
      - name: All checks passed
        run: echo "android build + lint passed"
