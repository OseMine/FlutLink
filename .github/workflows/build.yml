name: build

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '*.md'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      FLUTCLOUD_URL: ${{ secrets.FLUTCLOUD_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup

      - name: Run rust checks
        uses: ./.github/actions/checks

  artifacts:
    name: Build artifacts (${{ matrix.name }})
    if: github.event_name == 'push'
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-aarch64
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            name: macos-x86_64
            args: --target x86_64-apple-darwin
          - platform: ubuntu-latest
            name: linux
            args: --bundles deb,appimage
          - platform: windows-latest
            name: windows
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # Same preconfiguration as the release builds: bake the server URL in
      # at compile time (`option_env!`, see src-tauri/src/flutcloud.rs).
      FLUTCLOUD_URL: ${{ secrets.FLUTCLOUD_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust toolchain and Tauri deps
        uses: ./.github/actions/setup

      - name: Add Rust targets (macOS)
        if: contains(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      # The `artifacts` job runs on every push to main. Updater artifacts are
      # signed with a private key that is only configured for tag-driven
      # releases (see release.yml / `createUpdaterArtifacts`), so skip building
      # them here to avoid failing on the missing TAURI_SIGNING_PRIVATE_KEY.
      - name: Build Tauri bundles
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}' ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flutlink-${{ matrix.name }}
          path: src-tauri/target/**/bundle
          if-no-files-found: error
          retention-days: 14

  android:
    name: Mobile artifacts (Android APK, unsigned debug)
    if: github.event_name == 'push'
    needs: [frontend, rust]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build unsigned debug APK (from KMP project)
        uses: ./.github/actions/kmp-android-build
        with:
          signed: "false"
          artifact-name: flutlink-android-debug

  ios:
    name: Mobile artifacts (iOS IPA, unsigned)
    if: github.event_name == 'push'
    needs: [frontend, rust]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build unsigned iOS IPA (from KMP project)
        uses: ./.github/actions/kmp-ios-build
        with:
          artifact-name: flutlink-ios-unsigned

  complete:
    name: CI complete
    needs: [frontend, rust, artifacts, android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all job results
        shell: bash
        env:
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
          ARTIFACTS: ${{ needs.artifacts.result }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          echo "Job results: frontend=$FRONTEND rust=$RUST artifacts=$ARTIFACTS android=$ANDROID ios=$IOS"
          fail=0
          for result in "$FRONTEND" "$RUST" "$ARTIFACTS" "$ANDROID" "$IOS"; do
            case "$result" in
              success|skipped) ;; # skipped = push-gated jobs on PR runs
              *) fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::At least one job failed - see results above"
            exit 1
          fi
          echo "All checks passed (frontend + rust + artifacts + mobile)"
