name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install opencode (pinned)
        shell: bash
        run: npm install --global opencode-ai@1.18.18

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          # OpenCode Zen API-Key als Secret anlegen (siehe opencode-review.yml).
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags "$GITHUB_SHA^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --oneline --no-merges "${PREV_TAG}..HEAD" 2>/dev/null)
          else
            LOG=$(git log --oneline --no-merges -20)
          fi
          echo "Generating release notes from:"
          printf '%s\n' "$LOG"

          opencode run --model opencode/deepseek-v4-flash-free --auto \
            "Erstelle kompakte, deutschsprachige Release-Notes für FlutLink $GITHUB_REF_NAME.
             Grundlage ist folgende Commit-Liste:
             ---
             $LOG
             ---
             Struktur: Abschnitte 'Neu', 'Behoben', 'Verbessert', 'Hinweise'.
             Gib ausschließlich den Markdown-Body aus (keine zusätzliche Erklärung)." \
            > release-notes.md || true

          if [ -s release-notes.md ]; then
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            cat release-notes.md >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: release-notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc signing identity so macOS builds downloaded from releases
          # are not treated as damaged. Set proper certs/secrets for real signing.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: v__VERSION__
          releaseName: "FlutLink v__VERSION__"
          releaseBody: ${{ needs.release-notes.outputs.body || 'See the assets below to download and install this version.' }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
