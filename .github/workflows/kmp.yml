name: kmp

# CI for the FlutLink mobile client (`kmp/`) — Kotlin Multiplatform with
# Android, JVM and iOS targets in one codebase (see kmp/README.md).
#
# Linux runners exercise androidTarget(), jvm() and the unit tests; macOS
# runners additionally compile the iOS Kotlin targets. The ubuntu-24.04
# runners ship an Android SDK (ANDROID_HOME is preset), so the gradle wrapper
# builds directly; the macOS job installs commandline tools via
# android-actions/setup-android because AGP needs an SDK even for iOS-only
# Gradle invocations.

on:
  push:
    paths:
      - 'kmp/**'
      - '.github/workflows/kmp.yml'
      - '.github/actions/kmp-android-build/**'
      - '.github/actions/kmp-ios-build/**'
  pull_request:
    paths:
      - 'kmp/**'
      - '.github/workflows/kmp.yml'
      - '.github/actions/kmp-android-build/**'
      - '.github/actions/kmp-ios-build/**'

permissions:
  contents: read

concurrency:
  group: kmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (assembleDebug)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-home-cache-cleanup: true

      - name: Build debug APK
        working-directory: kmp
        run: |
          chmod +x gradlew
          ./gradlew :android-app:assembleDebug --console=plain

  test:
    name: Unit tests (testAndroidHostTest)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-home-cache-cleanup: true

      - name: Run unit tests
        working-directory: kmp
        run: |
          chmod +x gradlew
          ./gradlew :shared:testAndroidHostTest --console=plain

  jvm:
    name: JVM target (compileKotlinJvm)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-home-cache-cleanup: true

      - name: Compile JVM target
        working-directory: kmp
        run: |
          chmod +x gradlew
          ./gradlew :shared:compileKotlinJvm --console=plain

  ios:
    name: iOS targets (compile, macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android platform
        # API 37 platforms ship under the new extension-level naming.
        run: sdkmanager --install "platforms;android-37.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-home-cache-cleanup: true

      - name: Compile iOS targets
        working-directory: kmp
        run: |
          chmod +x gradlew
          ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 --console=plain \
            "-Dorg.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8"

  lint:
    name: Lint (lintDebug)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-home-cache-cleanup: true

      - name: Run Android lint
        working-directory: kmp
        run: |
          chmod +x gradlew
          ./gradlew :android-app:lintDebug --console=plain

  complete:
    name: KMP CI complete
    needs: [build, test, jvm, ios, lint]
    runs-on: ubuntu-24.04
    steps:
      - name: All checks passed
        run: echo "kmp build + tests + jvm + iOS compile + lint passed"
