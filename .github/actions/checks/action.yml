name: Run rust checks
description: >-
  Compiles the Tauri backend, runs fmt/clippy (with -D warnings) and the full
  test suite under src-tauri. Intended for every rust job regardless of the
  workflow that hosts it.

runs:
  using: composite
  steps:
    - name: Check formatting
      shell: bash
      run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

    - name: Run clippy with warnings as errors
      shell: bash
      run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

    - name: Run tests
      shell: bash
      run: cargo test --manifest-path src-tauri/Cargo.toml
