name: Build KMP Android APK
description: Set up JDK + Gradle, optionally sign, build and upload an APK from the KMP project (kmp/).

inputs:
  signed:
    description: "Build a signed release APK (true) or unsigned debug APK (false)"
    required: false
    default: "false"
  keystore:
    description: "Base64-encoded JKS keystore (required when signed=true)"
    required: false
    default: ""
  keystore-store-password:
    description: "Keystore password"
    required: false
    default: ""
  keystore-key-alias:
    description: "Key alias"
    required: false
    default: ""
  keystore-key-password:
    description: "Key password"
    required: false
    default: ""
  artifact-name:
    description: "Name for the uploaded artifact"
    required: false
    default: "flutlink-android"

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: 17

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      with:
        gradle-home-cache-cleanup: true

    - name: Verify signing inputs
      if: inputs.signed == 'true'
      shell: bash
      env:
        KEYSTORE_B64: ${{ inputs.keystore }}
      run: |
        if [ -z "$KEYSTORE_B64" ]; then
          echo "::error title=Signing aborted::signed=true, aber das Keystore-Secret ist leer."
          echo "::error::Ohne Keystore wuerde Gradle still ein UNSIGNIERTES Release-APK erzeugen."
          echo "::error::Bitte ANDROID_KEYSTORE (Base64) setzen oder den Build mit signed=false starten."
          exit 1
        fi

    - name: Decode keystore
      if: inputs.signed == 'true' && inputs.keystore != ''
      shell: bash
      run: echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks
      env:
        KEYSTORE_B64: ${{ inputs.keystore }}

    - name: Build APK
      shell: bash
      working-directory: kmp
      env:
        KEYSTORE_PATH: ${{ inputs.signed == 'true' && inputs.keystore != '' && '/tmp/release.jks' || '' }}
        KEYSTORE_STORE_PASSWORD: ${{ inputs.keystore-store-password }}
        KEYSTORE_KEY_ALIAS: ${{ inputs.keystore-key-alias }}
        KEYSTORE_KEY_PASSWORD: ${{ inputs.keystore-key-password }}
      run: |
        chmod +x gradlew
        if [ "${{ inputs.signed }}" = "true" ]; then
          ./gradlew :shared:assembleRelease --console=plain
        else
          ./gradlew :shared:assembleDebug --console=plain
        fi

    - name: Upload APK
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.artifact-name }}
        path: kmp/shared/build/outputs/apk/${{ inputs.signed == 'true' && 'release' || 'debug' }}/*.apk
        if-no-files-found: error
        retention-days: 14
