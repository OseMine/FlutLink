name: Build KMP iOS IPA (unsigned)
description: Build the shared KMP framework and archive the iosApp Xcode shell into an UNSIGNED .ipa (macOS runners only).

inputs:
  version:
    description: "Marketing version (CFBundleShortVersionString); a leading 'v' is stripped. Empty = Config.xcconfig default."
    required: false
    default: ""
  build-number:
    description: "Build number (CFBundleVersion). Empty = project default."
    required: false
    default: ""
  artifact-name:
    description: "Name for the uploaded artifact"
    required: false
    default: "flutlink-ios-unsigned"

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: 17

    # AGP configures the :shared KMP library module, so an SDK is required
    # even when only linking iOS frameworks.
    - name: Set up Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

    - name: Install Android platform
      shell: bash
      # API 37 platforms ship under the new extension-level naming.
      run: sdkmanager --install "platforms;android-37.0" > /dev/null

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      with:
        gradle-home-cache-cleanup: true

    # Pre-link the device framework so the Xcode script phase's Gradle call
    # is a cheap up-to-date check, with memory settings we control.
    - name: Link Shared framework (iosArm64, release)
      shell: bash
      working-directory: kmp
      run: |
        chmod +x gradlew
        ./gradlew :shared:linkReleaseFrameworkIosArm64 --console=plain \
          "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC"

    - name: Archive app (unsigned)
      shell: bash
      working-directory: kmp/iosApp
      env:
        EXPECTED_VERSION: ${{ inputs.version }}
      run: |
        VERSION_ARGS=()
        if [ -n "$EXPECTED_VERSION" ]; then
          VERSION_ARGS+=("MARKETING_VERSION=${EXPECTED_VERSION#v}")
        fi
        if [ -n "${{ inputs.build-number }}" ]; then
          VERSION_ARGS+=("CURRENT_PROJECT_VERSION=${{ inputs.build-number }}")
        fi
        xcodebuild \
          -project iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath "$RUNNER_TEMP/FlutLink.xcarchive" \
          archive \
          "${VERSION_ARGS[@]}" \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

    # Compose resources are synced into the app by the Xcode script phase
    # (embedAndSignAppleFrameworkForXcode -> syncComposeResourcesForIos).
    # Without them stringResource() throws MissingResourceException and the
    # app aborts on first composition (SIGABRT in UIApplication first commit).
    - name: Verify compose resources in app bundle
      shell: bash
      run: |
        APP=$(find "$RUNNER_TEMP/FlutLink.xcarchive/Products/Applications" -type d -name "*.app" | head -n1)
        if [ ! -d "$APP/compose-resources/values" ]; then
          echo "error: compose-resources missing from $APP - stringResource() would abort at launch" >&2
          exit 1
        fi
        echo "compose-resources contents:"
        find "$APP/compose-resources" -type f

    - name: Package unsigned IPA
      shell: bash
      working-directory: kmp/iosApp
      run: |
        mkdir -p build/Payload
        cp -R "$RUNNER_TEMP/FlutLink.xcarchive/Products/Applications/"*.app build/Payload/
        cd build
        zip -qry FlutLink-ios-unsigned.ipa Payload

    - name: Package dSYMs
      shell: bash
      working-directory: kmp/iosApp
      run: |
        mkdir -p build/dSYMs
        # Signing is disabled, but dwarf-with-dsym dSYMs are still generated
        # into the archive; they let users symbolicate .ips crash reports.
        cp -R "$RUNNER_TEMP"/FlutLink.xcarchive/dSYMs/*.dSYM build/dSYMs/ || true
        cd build && zip -qry FlutLink-ios-dsyms.zip dSYMs

    - name: Upload dSYMs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.artifact-name }}-dsyms
        path: kmp/iosApp/build/FlutLink-ios-dsyms.zip
        if-no-files-found: warn
        retention-days: 14

    - name: Verify Info.plist version
      shell: bash
      working-directory: kmp/iosApp
      env:
        EXPECTED_VERSION: ${{ inputs.version }}
      run: |
        APP=$(find "$RUNNER_TEMP/FlutLink.xcarchive/Products/Applications" -type d -name "*.app" | head -n1)
        BAKED=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
        WANT="${EXPECTED_VERSION#v}"
        echo "IPA version: $BAKED (expected: ${WANT:-Config.xcconfig default})"
        if [ -n "$WANT" ] && [ "$BAKED" != "$WANT" ]; then
          echo "Version mismatch" >&2
          exit 1
        fi

    - name: Upload IPA
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.artifact-name }}
        path: kmp/iosApp/build/*.ipa
        if-no-files-found: error
        retention-days: 14
