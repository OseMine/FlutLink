name: Feature Request
description: Suggest an idea for FlutLink
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see.

  - type: dropdown
    id: target
    attributes:
      label: Target platform
      description: "Which platform should this feature target?"
      options:
        - Desktop (Windows/macOS/Linux)
        - Android
        - Both (feature parity)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Files / WebDAV browser
        - Shares
        - Sync engine
        - Admin panel
        - Settings / Theme / i18n
        - Login / Accounts
        - Notifications / Tray
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: "What problem does this solve, or what workflow does it enable?"
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: "Describe how the feature should work, including UI/UX details."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: "Any alternative solutions or workarounds you considered."

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Any other context, mockups, or references here."
