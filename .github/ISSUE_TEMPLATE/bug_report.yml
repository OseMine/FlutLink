name: Bug Report
description: Report a problem with FlutLink
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: input
    id: version
    attributes:
      label: FlutLink version
      description: "Which version of FlutLink are you using? (Desktop: Settings > About · Android: Settings > About)"
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: nextcloud-version
    attributes:
      label: FlutCloud server version
      placeholder: "e.g. 30"
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Android
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device (Android only)
      description: "Manufacturer and model, e.g. Samsung Galaxy S24. Leave blank for desktop."
      placeholder: "e.g. Samsung Galaxy S24"
    validations:
      required: false

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Bundled app (from release)
        - `npm run tauri dev`
        - Android APK (from GitHub release)
        - Android APK (built locally)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "How can we reproduce this bug?"
      placeholder: |
        1. Open FlutLink
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "What actually happened? Include error messages or screenshots if possible."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste relevant logs here.
        - Desktop (Rust stderr): run with `cargo tauri dev` and copy console output.
        - Android: `adb logcat -d *:E | grep -i flutcloud`
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Any other context about the problem here."
