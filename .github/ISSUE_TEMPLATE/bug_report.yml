name: Bug Report
description: Report a problem with FlutLink
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: input
    id: version
    attributes:
      label: FlutLink version
      description: "Which version of FlutLink are you using?"
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: nextcloud-version
    attributes:
      label: Nextcloud server version
      description: "Which Nextcloud server version is the FlutCloud server running?"
      placeholder: "e.g. 30"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Android
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Bundled app (from release)
        - `npm run tauri dev`
        - Android APK
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "How can we reproduce this bug?"
      placeholder: |
        1. Open FlutLink
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "What actually happened? Include error messages or screenshots if possible."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Paste relevant logs (webview console, Rust stderr, sync journal errors) here."
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Any other context about the problem here."
