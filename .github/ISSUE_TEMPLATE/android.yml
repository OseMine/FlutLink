name: Android
description: Bug report or feature request for FlutLink Android
labels: ["android"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue or suggesting a feature for the FlutLink Android app!

  - type: dropdown
    id: type
    attributes:
      label: Issue type
      options:
        - Bug report
        - Feature request
    validations:
      required: true

  - type: input
    id: apk-version
    attributes:
      label: FlutLink Android version
      description: "Found in Settings > About, or the APK filename."
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: "Manufacturer and model."
      placeholder: "e.g. Samsung Galaxy S24"
    validations:
      required: true

  - type: dropdown
    id: android-version
    attributes:
      label: Android version
      options:
        - "16"
        - "15"
        - "14"
        - "13"
        - "12"
        - "11"
        - "10"
        - "9 or older"
    validations:
      required: true

  - type: input
    id: nextcloud-version
    attributes:
      label: FlutCloud server version
      placeholder: "e.g. 30"
    validations:
      required: false

  # --- Bug-only fields ---
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "How can we reproduce this bug?"
      placeholder: |
        1. Open FlutLink
        2. Tap on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "What actually happened? Include screenshots if possible."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logcat / crash log
      description: |
        Paste relevant logs here. To capture logcat:
        ```
        adb logcat -d *:E | grep -i flutcloud
        ```
      render: shell

  # --- Feature-only fields ---
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: "What problem does this feature solve?"
      placeholder: "I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: "How should the feature work?"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Any other context, mockups, or references."
