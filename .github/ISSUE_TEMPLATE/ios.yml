name: iOS
description: Bug report or feature request for FlutLink iOS
labels: ["ios"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue or suggesting a feature for the FlutLink iOS app!

  - type: dropdown
    id: type
    attributes:
      label: Issue type
      options:
        - Bug report
        - Feature request
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: FlutLink iOS version
      description: "Found in Settings > About."
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: "Model and generation."
      placeholder: "e.g. iPhone 15 Pro"
    validations:
      required: true

  - type: dropdown
    id: ios-version
    attributes:
      label: iOS version
      options:
        - "18.x"
        - "17.x"
        - "16.x or older"
    validations:
      required: true

  - type: input
    id: nextcloud-version
    attributes:
      label: FlutCloud server version
      placeholder: "e.g. 30"
    validations:
      required: false

  # --- Bug-only fields ---
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "How can we reproduce this bug?"
      placeholder: |
        1. Open FlutLink
        2. Tap on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: "What actually happened? Include screenshots if possible."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Crash log / Console output
      description: |
        Paste relevant logs from Xcode Console or a device crash log.

  # --- Feature-only fields ---
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: "What problem does this feature solve?"
      placeholder: "I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: "How should the feature work?"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: "Any other context, mockups, or references."
