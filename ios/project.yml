name: FlutLink
options:
  bundleIdPrefix: com.flutcloud.flutlink
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  knownRegions:
    - en
    - de

targets:
  FlutLink:
    type: application
    platform: iOS
    sources:
      - path: FlutLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flutcloud.flutlink.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: FlutLink/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: false
        CODE_SIGNING_ALLOWED: false
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # TEST — iOS port created by opencode. Not a production build.
        FLUTCLOUD_URL: "$(FLUTCLOUD_URL)"
